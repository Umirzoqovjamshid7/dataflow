# Host Nginx: replace datrix.63-183-214-123.sslip.io with your actual domain.
# Obtain a valid certificate before enabling this configuration.
server {
    listen 80;
    server_name datrix.63-183-214-123.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name datrix.63-183-214-123.sslip.io;
    ssl_certificate /etc/letsencrypt/live/datrix.63-183-214-123.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datrix.63-183-214-123.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
