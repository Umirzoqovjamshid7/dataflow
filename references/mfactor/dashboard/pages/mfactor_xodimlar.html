<style>
:root{--bg:#061321;--side:#091a2c;--panel:#0b1c2f;--line:#203955;--gold:#f5b91e;--green:#16d69a;--red:#ff5362;--blue:#6fa8ff;--muted:#91a7c9;--text:#f7f9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 67% -10%,#102a47 0,#061321 42%);color:var(--text);font:14px Segoe UI,Arial,sans-serif}.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}aside{background:linear-gradient(180deg,#091a2c,#071527);border-right:1px solid #1c3752;position:sticky;top:0;height:100vh}.brand{height:130px;text-align:center;padding:22px 16px;border-bottom:1px solid #1b3550}.logo{width:48px;height:48px;margin:0 auto 8px;color:var(--gold);display:grid;place-items:center;font-size:34px;font-weight:800}.brand b{display:block;color:var(--gold);font-size:18px;letter-spacing:3px}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:3px;margin-top:3px}nav{padding:17px 8px}nav a{display:block;padding:14px 18px;margin:4px 0;border-radius:8px;color:#a8bddf;text-decoration:none;font-size:16px}nav a.active{background:linear-gradient(90deg,#44371b,#27291f);color:#fff;border:1px solid #c28b16;box-shadow:inset 4px 0 var(--gold)}main{min-width:0}header{padding:24px 26px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:22px}.heading h1{font-size:32px;line-height:1.1;margin:0 0 9px}.heading p{margin:0;color:#9fb2d2;font-size:16px}.filters{min-width:580px}.periodBar{justify-content:flex-end}.content{padding:0 26px 28px}.period{color:var(--muted);font-size:12px;margin:2px 0 16px}.warning,.toast{display:none;padding:11px 14px;border-radius:8px;margin:0 0 14px}.warning{background:#3c2e12;border:1px solid #956d16;color:#ffdc70}.toast{background:#103b2d;border:1px solid #197d59;color:#8af1c0}.toast.err{background:#3d1c25;border-color:#96364b;color:#ff97a5}
.overview{background:linear-gradient(135deg,#0b2035,#081a2e);border:1px solid #b17d10;border-radius:11px;padding:19px 18px 14px;margin-bottom:18px}.overview-top{display:grid;grid-template-columns:minmax(300px,1.35fr) repeat(2,minmax(150px,.65fr));gap:18px;align-items:center}.overview-person{display:flex;align-items:center;gap:16px}.overview-person .avatar{width:94px;height:94px;flex:0 0 94px}.avatar{border-radius:50%;border:2px solid var(--gold);background:linear-gradient(145deg,#33462d,#1b1d18);display:grid;place-items:center;color:#f7d57d;font-size:27px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.overview-name{font-size:24px;font-weight:800}.overview-sub{color:#abc0e0;font-size:16px;margin-top:7px}.headline{border-left:1px solid #314a67;padding-left:28px}.headline span,.stat-label{display:block;color:#aebdd7;font-size:13px}.headline b{display:block;font-size:37px;margin-top:5px}.headline.green b{color:var(--green)}.overview-bottom{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #233b57;margin-top:15px;padding-top:14px;gap:10px}.stat{display:flex;align-items:center;gap:10px;padding:0 14px;border-right:1px solid #29415d}.stat:last-child{border-right:0}.stat-icon{font-size:30px;color:var(--blue)}.stat:nth-child(2) .stat-icon{color:var(--green)}.stat:nth-child(3) .stat-icon,.stat:nth-child(5) .stat-icon{color:var(--gold)}.stat b{display:block;font-size:25px;margin-top:3px}.stat:nth-child(2) b{color:var(--green)}.stat:nth-child(3) b{color:var(--gold)}.stat:nth-child(4) b{color:var(--blue)}
.layout{display:block}.section-title{font-size:22px;margin:0 0 14px}.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.project{background:linear-gradient(145deg,#0d2034,#091a2c);border:1px solid #a9770d;border-radius:11px;padding:24px;min-width:0}.project-head{display:flex;align-items:center;gap:13px;margin-bottom:20px}.project-icon{width:50px;height:50px;border:1px solid #8b681c;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:25px;background:#1b211f}.project h3{font-size:18px;margin:0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-stats{display:grid;grid-template-columns:1fr 1fr;gap:0}.pstat{padding:0 12px 15px 0;min-width:0}.pstat:nth-child(even){padding-left:15px;border-left:1px solid #263e5b}.pstat:nth-child(n+3){padding-top:15px;border-top:1px solid #263e5b}.pstat span{display:block;color:#a3b5d3;font-size:12px}.pstat b{display:block;margin-top:7px;font-size:27px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pstat:nth-child(2) b{color:var(--red)}.pstat:nth-child(3) b,.pstat:nth-child(4) b{color:var(--gold);font-size:18px}.progress{height:10px;background:#1e324d;border-radius:6px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:inherit}.progress-line{display:flex;justify-content:space-between;color:#a3b5d3;font-size:12px;margin-top:6px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px}.photo-wrap{position:relative}.photo-btn,.photo-del{position:absolute;border-radius:50%;display:grid;place-items:center;cursor:pointer}.photo-btn{inset:3px;border:0;background:#000a;color:var(--gold);font-size:22px;opacity:0}.photo-wrap:hover .photo-btn,.photo-btn:focus-visible{opacity:1}.photo-del{right:-2px;bottom:1px;width:25px;height:25px;background:#311620;border:1px solid #9c3a4b;color:#ff8090}.photo-wrap.busy .photo-btn{opacity:1}
@media(max-width:1250px){.layout{grid-template-columns:1fr}.ranking{order:2}.overview-top{grid-template-columns:1.4fr 1fr 1fr}}@media(max-width:950px){.app{grid-template-columns:1fr}aside{display:none}header{display:block}.filters{min-width:0;margin-top:16px}.periodBar{justify-content:flex-start}.overview-top{grid-template-columns:1fr 1fr}.overview-person{grid-column:1/-1}.overview-bottom{grid-template-columns:repeat(3,1fr)}.stat:nth-child(3){border-right:0}.project-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){header,.content{padding-left:14px;padding-right:14px}.heading h1{font-size:25px}.heading p{font-size:13px}.overview{padding:14px 12px}.overview-top{grid-template-columns:1fr}.headline{border-left:0;border-top:1px solid #314a67;padding:10px 0 0}.overview-bottom{grid-template-columns:repeat(2,1fr)}.stat{padding:9px 6px;border-right:0;border-bottom:1px solid #263e5b}.stat:last-child{border-bottom:0}.project-grid{grid-template-columns:1fr}.rank-item{grid-template-columns:25px 35px minmax(0,1fr) auto auto}}
</style><link rel="stylesheet" href="/mfactor_live.css"><script src="/mfactor_live.js" defer></script></head>
<body><div class="app"><aside><div class="brand"><div class="logo">M</div><b>MFACTOR</b><small>ANALYTICS</small></div><nav><a href="/mfactor_umumiy.html">⌂ &nbsp; Umumiy</a><a class="active" href="/mfactor_xodimlar.html">♟ &nbsp; Xodimlar</a><a href="/mfactor_pbx.html">☎ &nbsp; Qo‘ng‘iroqlar</a><a href="/mfactor_bitrix.html">▣ &nbsp; Bitrix</a><a href="/mfactor_facebook.html">f &nbsp; Facebook</a></nav></aside><main><header><div class="heading"><h1>Xodimlar natijalari</h1><p>Har bir xodimning ko‘rsatkichlari va loyihalar bo‘yicha natijalari</p></div><div class="filters"><div id="periodBar"></div></div></header><div class="content"><div class="warning" id="warning"></div><div class="toast" id="toast"></div><div class="period" id="periodInfo"></div><section class="overview" id="overview"></section><div class="layout"><h2 class="section-title">Loyihalar bo‘yicha natijalar</h2><section class="project-grid" id="projectGrid"></section></div></div></main></div><input type="file" id="photoInput" accept="image/jpeg,image/png" hidden><script src="/mfactor_filters.js"></script><script>
const fmt=n=>new Intl.NumberFormat('uz-UZ').format(Number(n||0));const esc=v=>{const e=document.createElement('div');e.textContent=v??'';return e.innerHTML};const icons=['♛','✈','♟','◈','▦','▰','◆'];function fmtDur(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}function avatar(x){return x.photo?`<img src="${esc(x.photo)}" alt="${esc(x.name)}">`:esc(x.initials||'?')}
function showToast(text,error){toast.textContent=text;toast.className='toast'+(error?' err':'');toast.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.display='none',5000)}const PHOTO_MAX=3*1024*1024;let uploadLocked=false,pendingName='';function uploadHeaders(){const t=localStorage.getItem('mfUploadToken')||'';return t?{'X-Upload-Token':t}:{}}function ensureToken(){if(!uploadLocked||localStorage.getItem('mfUploadToken'))return true;const t=(prompt('Rasm yuklash paroli:')||'').trim();if(!t)return false;localStorage.setItem('mfUploadToken',t);return true}async function photoRequest(name,opt){try{const r=await fetch('/mfactor_api/employee_photo?employee='+encodeURIComponent(name)+(opt.del?'&action=delete':''),{method:'POST',headers:uploadHeaders(),body:opt.file||null});const d=await r.json().catch(()=>({}));if(r.status===403){localStorage.removeItem('mfUploadToken');throw Error(d.error||'Yuklash paroli noto‘g‘ri.')}if(!r.ok||!d.ok)throw Error(d.error||`Server ${r.status}`);showToast(d.message||'Bajarildi.');load()}catch(e){showToast(e.message,true)}}document.addEventListener('click',e=>{const b=e.target.closest('.photo-btn,.photo-del');if(!b)return;const name=b.closest('.photo-wrap').dataset.name;if(!ensureToken())return;if(b.classList.contains('photo-del')){if(confirm(`${name} rasmini o‘chirilsinmi?`))photoRequest(name,{del:true})}else{pendingName=name;photoInput.value='';photoInput.click()}});photoInput.addEventListener('change',()=>{const f=photoInput.files[0];if(!f||!pendingName)return;if(f.size>PHOTO_MAX)return showToast('Rasm hajmi 3 MB dan oshmasin.',true);photoRequest(pendingName,{file:f})});
function totals(d){return(d.employees||[]).reduce((a,x)=>{a.leads+=+x.leads||0;a.sold+=+x.sold||0;a.calls+=+x.calls||0;a.answered+=+x.answered_calls||0;a.talk+=+x.talk_seconds||0;return a},{leads:0,sold:0,calls:0,answered:0,talk:0})}function overviewTemplate(d){const t=totals(d),top=(d.employees||[])[0]||{name:'Xodimlar',initials:'X'},topSold=(top.funnels||[]).reduce((n,f)=>n+(+f.payment_count||0),0);return `<div class="overview-top"><div class="overview-person"><div class="photo-wrap" data-name="${esc(top.name)}"><div class="avatar">${avatar(top)}</div>${top.can_upload?`<button class="photo-btn" title="Rasm yuklash">📷</button>${top.photo?'<button class="photo-del" title="Rasmni o‘chirish">✕</button>':''}`:''}</div><div><div class="overview-name">${esc(top.name)}</div><div class="overview-sub">MFactor sotuv menejeri</div></div></div><div class="headline"><span>Umumiy lid</span><b>${fmt(top.leads)}</b></div><div class="headline green"><span>Sotilgan</span><b>${fmt(topSold)} ta</b></div></div><div class="overview-bottom"><div class="stat"><div class="stat-icon">☎</div><div><span class="stat-label">Qo‘ng‘iroqlar</span><b>${fmt(t.calls)}</b></div></div><div class="stat"><div class="stat-icon">◉</div><div><span class="stat-label">Javob berilgan</span><b>${fmt(t.answered)}</b></div></div><div class="stat"><div class="stat-icon">◔</div><div><span class="stat-label">Javob foizi</span><b>${t.calls?fmt(t.answered*100/t.calls)+'%':'0%'}</b></div></div><div class="stat"><div class="stat-icon">◷</div><div><span class="stat-label">Suhbat vaqti</span><b>${fmtDur(t.talk)}</b></div></div><div class="stat"><div class="stat-icon">⏱</div><div><span class="stat-label">O‘rtacha suhbat</span><b>${t.answered?fmtDur(t.talk/t.answered):'0:00'}</b></div></div></div>`}
function projects(d){const cats=d.categories||[];return cats.map((c,i)=>{const fs=(d.employees||[]).map(x=>(x.funnels||[]).find(f=>+f.id===+c.id)).filter(Boolean),total=fs.reduce((n,f)=>n+(+f.total||0),0),sold=fs.reduce((n,f)=>n+(+f.payment_count||0),0),amount=fs.reduce((n,f)=>n+(+f.payment_amount||0),0),lost=fs.reduce((n,f)=>n+(+f.lost||0),0),conv=total?sold*100/total:0;return `<article class="project"><div class="project-head"><div class="project-icon">${icons[i%icons.length]}</div><h3>${esc(c.name)}</h3></div><div class="project-stats"><div class="pstat"><span>Umumiy lid</span><b>${fmt(total)}</b></div><div class="pstat"><span>Sotilgan</span><b>${fmt(sold)} ta</b></div><div class="pstat"><span>Sotuv summasi</span><b>${amount?fmt(amount)+' so‘m':'0 so‘m'}</b></div><div class="pstat"><span>Konversiya</span><b>${fmt(conv)}%</b></div></div><div class="progress"><i style="width:${Math.min(100,conv)}%"></i></div><div class="progress-line"><span>${lost?fmt(lost)+' yo‘qotilgan':''}</span><span>${fmt(conv)}%</span></div></article>`}).join('')||'<div class="empty">Tanlangan davrda loyiha ma’lumoti yo‘q.</div>'}function ranking(d){return(d.employees||[]).map((x,i)=>{const sold=(x.funnels||[]).reduce((n,f)=>n+(+f.payment_count||0),0);return `<div class="rank-item"><div class="rank-no">${i+1}</div><div class="avatar rank-avatar">${avatar(x)}</div><div class="rank-name">${esc(x.name)}<span class="rank-role">Sotuv menejeri</span></div><div class="rank-leads">${fmt(x.leads)}</div><div class="rank-sold ${sold?'':'zero'}">${fmt(sold)}</div></div>`}).join('')||'<div class="empty">Xodimlar ma’lumoti yo‘q.</div>'}
function render(d){uploadLocked=!!d.upload_locked;period.sync(d.start,d.end);periodInfo.textContent=`Davr: ${d.start} — ${d.end}`;warning.style.display=d.error?'block':'none';warning.textContent=d.error||'';overview.innerHTML=overviewTemplate(d);projectGrid.innerHTML=projects(d)}async function load(){try{const r=await fetch('/mfactor_api/employees?'+new URLSearchParams(period.range()));if(!r.ok)throw Error('Server ma’lumotni qaytara olmadi');render(await r.json())}catch(e){warning.style.display='block';warning.textContent='Xodimlar ma’lumotini yuklashda xato: '+e.message}}const period=MFilter.mount(periodBar,load,{defaultPreset:'buyil'});load();setInterval(load,60000);
</script></body></html>
<style>.pstat.wide{grid-column:1/-1;padding-right:0}.pstat.wide b{color:var(--gold)!important;font-size:18px!important}</style>
<script>
function fmtLastCall(value){if(!value)return'—';const d=new Date(String(value).replace(' ','T'));if(Number.isNaN(d.getTime()))return esc(value);return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
projects=function(d){const cats=d.categories||[];return cats.map((c,i)=>{const fs=(d.employees||[]).map(x=>(x.funnels||[]).find(f=>+f.id===+c.id)).filter(Boolean),total=fs.reduce((n,f)=>n+(+f.total||0),0),sold=fs.reduce((n,f)=>n+(+f.payment_count||0),0),amount=fs.reduce((n,f)=>n+(+f.payment_amount||0),0),lost=fs.reduce((n,f)=>n+(+f.lost||0),0),conv=total?sold*100/total:0,lastCall=fs.map(f=>f.last_call_at).filter(Boolean).sort().pop()||'';return `<article class="project"><div class="project-head"><div class="project-icon">${icons[i%icons.length]}</div><h3>${esc(c.name)}</h3></div><div class="project-stats"><div class="pstat"><span>Umumiy lid</span><b>${fmt(total)}</b></div><div class="pstat"><span>Sotuvlar soni</span><b>${fmt(sold)} ta</b></div><div class="pstat"><span>Sotuv summasi</span><b>${amount?fmt(amount)+' so‘m':'0 so‘m'}</b></div><div class="pstat"><span>Konversiya</span><b>${fmt(conv)}%</b></div><div class="pstat wide"><span>Oxirgi qo‘ng‘iroq</span><b>${fmtLastCall(lastCall)}</b></div></div><div class="progress"><i style="width:${Math.min(100,conv)}%"></i></div><div class="progress-line"><span>${lost?fmt(lost)+' yo‘qotilgan':''}</span><span>${fmt(conv)}%</span></div></article>`}).join('')||'<div class="empty">Tanlangan davrda loyiha ma’lumoti yo‘q.</div>'}
</script>
<script>
projects=function(d){const cats=d.categories||[];return cats.map((c,i)=>{const fs=(d.employees||[]).map(x=>(x.funnels||[]).find(f=>+f.id===+c.id)).filter(Boolean),total=fs.reduce((n,f)=>n+(+f.total||0),0),sold=fs.reduce((n,f)=>n+(+f.payment_count||0),0),amount=fs.reduce((n,f)=>n+(+f.payment_amount||0),0),lost=fs.reduce((n,f)=>n+(+f.lost||0),0),lostPercent=total?lost*100/total:0,lastCall=fs.map(f=>f.last_call_at).filter(Boolean).sort().pop()||'';return `<article class="project"><div class="project-head"><div class="project-icon">${icons[i%icons.length]}</div><h3>${esc(c.name)}</h3></div><div class="project-stats"><div class="pstat"><span>Umumiy lid</span><b>${fmt(total)}</b></div><div class="pstat"><span>Sotuvlar soni</span><b>${fmt(sold)} ta</b></div><div class="pstat"><span>Sotuv summasi</span><b>${amount?fmt(amount)+' so‘m':'0 so‘m'}</b></div><div class="pstat"><span>Yo‘qotilgan foiz</span><b>${fmt(lostPercent)}%</b></div><div class="pstat wide"><span>Oxirgi qo‘ng‘iroq</span><b>${fmtLastCall(lastCall)}</b></div></div><div class="progress"><i style="width:${Math.min(100,lostPercent)}%"></i></div><div class="progress-line"><span>${lost?fmt(lost)+' yo‘qotilgan':''}</span><span>${fmt(lostPercent)}%</span></div></article>`}).join('')||'<div class="empty">Tanlangan davrda loyiha ma’lumoti yo‘q.</div>'}
</script>
<script>
const renderWithRoundedLostPercent=render;render=function(d){renderWithRoundedLostPercent(d);document.querySelectorAll('.project').forEach(card=>{const value=card.querySelector('.pstat:nth-child(4) b'),label=card.querySelector('.progress-line span:last-child'),bar=card.querySelector('.progress i');[value,label].forEach(el=>{if(!el)return;const n=parseFloat(el.textContent);if(Number.isFinite(n))el.textContent=Math.round(n)+'%'});if(bar){const n=parseFloat(label?.textContent);if(Number.isFinite(n))bar.style.width=Math.min(100,n)+'%'}})};
</script>
